<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Aetherforge – Premium TCG Pack Opening</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg-deep: #07070a;
  --bg-main: #0c0c10;
  --bg-card: #14141a;
  --bg-elevated: #1a1a22;
  --bg-hover: #22222c;
  --gold: #d4af37;
  --gold-light: #f0d878;
  --gold-dark: #a88b2a;
  --accent: #7b5cff;
  --accent-glow: rgba(123, 92, 255, 0.35);
  --text: #f0f0f5;
  --text-dim: #9898a8;
  --text-muted: #6a6a7a;
  --success: #3dd68c;
  --danger: #ff5c5c;
  --rare-common: #9aa0a6;
  --rare-uncommon: #4ade80;
  --rare-rare: #60a5fa;
  --rare-double: #a78bfa;
  --rare-ultra: #f472b6;
  --rare-illustration: #fb923c;
  --rare-special: #facc15;
  --rare-hyper: #ef4444;
  --rare-secret: #e879f9;
  --radius: 16px;
  --radius-sm: 10px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-height: 68px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg-deep);
  color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px;
  line-height: 1.45;
}

#app {
  height: 100%;
  position: relative;
  overflow: hidden;
}

.screen {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
}
.screen.active {
  display: flex;
}

/* ===== LOADING ===== */
#loading-screen {
  background: var(--bg-deep);
  align-items: center;
  justify-content: center;
}
.loader {
  text-align: center;
}
.loader-ring {
  width: 64px;
  height: 64px;
  border: 3px solid rgba(212, 175, 55, 0.2);
  border-top-color: var(--gold);
  border-radius: 50%;
  margin: 0 auto 24px;
  animation: spin 0.9s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.loader-text {
  font-family: 'Orbitron', sans-serif;
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 4px;
  background: linear-gradient(135deg, var(--gold-light), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.loader-sub {
  margin-top: 8px;
  color: var(--text-muted);
  font-size: 13px;
}

/* ===== TOP BAR ===== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: linear-gradient(180deg, rgba(10,10,14,0.95), rgba(10,10,14,0.7));
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  z-index: 50;
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.brand-icon {
  color: var(--gold);
  font-size: 18px;
}
.brand-name {
  font-family: 'Orbitron', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--gold-light);
}
.top-stats {
  display: flex;
  align-items: center;
  gap: 12px;
}
.coin-display {
  display: flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
  border: 1px solid rgba(212,175,55,0.3);
  padding: 6px 12px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 14px;
}
.coin-icon {
  color: var(--gold);
  font-size: 14px;
}
.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.1);
  background: var(--bg-elevated);
  color: var(--text);
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s;
}
.icon-btn:active {
  transform: scale(0.92);
  background: var(--bg-hover);
}

/* ===== CONTENT ===== */
.content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px;
  padding-bottom: calc(var(--nav-height) + 20px + var(--safe-bottom));
  -webkit-overflow-scrolling: touch;
}

/* ===== BOTTOM NAV ===== */
.bottom-nav {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  display: flex;
  background: rgba(12,12,16,0.92);
  backdrop-filter: blur(16px);
  border-top: 1px solid rgba(255,255,255,0.07);
  z-index: 50;
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 11px;
  cursor: pointer;
  transition: color 0.2s;
  padding: 6px 0;
}
.nav-btn .nav-icon {
  font-size: 18px;
  line-height: 1;
}
.nav-btn.active {
  color: var(--gold);
}
.nav-btn:active {
  opacity: 0.7;
}

/* ===== BUTTONS ===== */
.btn-primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #1a1400;
  border: none;
  padding: 12px 24px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: 0 4px 16px rgba(212,175,55,0.25);
}
.btn-primary:active {
  transform: scale(0.97);
  box-shadow: 0 2px 8px rgba(212,175,55,0.2);
}
.btn-primary:disabled {
  opacity: 0.45;
  cursor: not-allowed;
  transform: none;
}
.btn-secondary {
  background: var(--bg-elevated);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.12);
  padding: 11px 20px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-secondary:active {
  background: var(--bg-hover);
}
.btn-danger {
  background: rgba(255,92,92,0.15);
  color: var(--danger);
  border: 1px solid rgba(255,92,92,0.3);
  padding: 10px 18px;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}

/* ===== CARDS (UI) ===== */
.section-title {
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 1.5px;
  color: var(--gold);
  margin-bottom: 12px;
  text-transform: uppercase;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
@media (min-width: 600px) {
  .card-grid {
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  }
}

/* ===== PACK CARDS ===== */
.pack-card {
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.07);
  overflow: hidden;
  transition: transform 0.2s, border-color 0.2s;
  cursor: pointer;
}
.pack-card:active {
  transform: scale(0.98);
}
.pack-visual-preview {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.pack-visual-preview::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,0.6));
}
.pack-info {
  padding: 12px;
}
.pack-name {
  font-weight: 700;
  font-size: 14px;
  margin-bottom: 4px;
}
.pack-price {
  display: flex;
  align-items: center;
  gap: 4px;
  color: var(--gold);
  font-weight: 600;
  font-size: 13px;
}
.pack-rarity-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ===== TCG CARD ===== */
.tcg-card {
  aspect-ratio: 63/88;
  border-radius: 10px;
  position: relative;
  overflow: hidden;
  background: var(--bg-elevated);
  border: 2px solid rgba(255,255,255,0.1);
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.15s ease-out;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.tcg-card .card-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
}
.tcg-card .card-frame {
  position: absolute;
  inset: 0;
  border-radius: 8px;
  pointer-events: none;
}
.tcg-card .card-name {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 8px 6px 6px;
  background: linear-gradient(transparent, rgba(0,0,0,0.85));
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.tcg-card .card-rarity {
  position: absolute;
  top: 6px;
  right: 6px;
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.tcg-card .card-shine {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    105deg,
    transparent 20%,
    rgba(255,255,255,0.15) 40%,
    rgba(255,255,255,0.35) 50%,
    rgba(255,255,255,0.15) 60%,
    transparent 80%
  );
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
  mix-blend-mode: overlay;
}
.tcg-card.holo .card-shine {
  opacity: 0.7;
  animation: shine-move 3s ease-in-out infinite;
}
@keyframes shine-move {
  0%, 100% { transform: translateX(-60%) skewX(-15deg); }
  50% { transform: translateX(60%) skewX(-15deg); }
}
.tcg-card.gold-border {
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(212,175,55,0.35), 0 8px 24px rgba(0,0,0,0.4);
}
.tcg-card.rainbow-border {
  border-image: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff) 1;
  box-shadow: 0 0 24px rgba(255,150,200,0.3);
}

/* Rarity colors */
.rarity-common { background: var(--rare-common); color: #111; }
.rarity-uncommon { background: var(--rare-uncommon); color: #111; }
.rarity-rare { background: var(--rare-rare); color: #111; }
.rarity-double { background: var(--rare-double); color: #111; }
.rarity-ultra { background: var(--rare-ultra); color: #111; }
.rarity-illustration { background: var(--rare-illustration); color: #111; }
.rarity-special { background: var(--rare-special); color: #111; }
.rarity-hyper { background: var(--rare-hyper); color: #fff; }
.rarity-secret { background: var(--rare-secret); color: #111; }

/* ===== HOME VIEW ===== */
.home-header {
  margin-bottom: 20px;
}
.welcome-text {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}
.progress-bar-wrap {
  margin: 16px 0;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.progress-bar {
  height: 8px;
  background: var(--bg-elevated);
  border-radius: 4px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold-dark), var(--gold));
  border-radius: 4px;
  transition: width 0.5s ease;
}
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}
.stat-box {
  background: var(--bg-card);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: var(--radius-sm);
  padding: 12px 8px;
  text-align: center;
}
.stat-value {
  font-size: 18px;
  font-weight: 700;
  color: var(--gold-light);
}
.stat-label {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.recent-pulls {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 8px;
  -webkit-overflow-scrolling: touch;
}
.recent-pulls .tcg-card {
  width: 90px;
  flex-shrink: 0;
}

/* ===== SHOP ===== */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}
@media (min-width: 500px) {
  .shop-grid {
    grid-template-columns: repeat(3, 1fr);
  }
}
@media (min-width: 800px) {
  .shop-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

/* ===== COLLECTION ===== */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
}
.filter-chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 20px;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
}
.filter-chip.active {
  background: rgba(212,175,55,0.15);
  border-color: var(--gold);
  color: var(--gold);
}
.search-input {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 11px 14px;
  color: var(--text);
  font-size: 14px;
  margin-bottom: 12px;
  outline: none;
}
.search-input:focus {
  border-color: var(--gold);
}
.search-input::placeholder {
  color: var(--text-muted);
}

/* ===== BINDER ===== */
.binder-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 14px;
  overflow-x: auto;
}
.binder-page {
  background: var(--bg-card);
  border-radius: var(--radius);
  padding: 12px;
  border: 1px solid rgba(255,255,255,0.07);
}
.binder-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}
.binder-slot {
  aspect-ratio: 63/88;
  background: rgba(255,255,255,0.03);
  border: 1px dashed rgba(255,255,255,0.12);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.binder-slot.filled {
  border-style: solid;
  border-color: rgba(255,255,255,0.15);
}
.binder-slot .tcg-card {
  width: 100%;
  height: 100%;
  border-radius: 6px;
}

/* ===== MARKET ===== */
.market-item {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 10px;
  margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,0.06);
}
.market-item .tcg-card {
  width: 56px;
  flex-shrink: 0;
}
.market-info {
  flex: 1;
  min-width: 0;
}
.market-name {
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.market-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.market-price {
  color: var(--gold);
  font-weight: 700;
  font-size: 14px;
}

/* ===== STATS ===== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}
.stats-card {
  background: var(--bg-card);
  border-radius: var(--radius-sm);
  padding: 16px;
  border: 1px solid rgba(255,255,255,0.06);
}
.stats-card .label {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.stats-card .value {
  font-size: 20px;
  font-weight: 700;
  color: var(--gold-light);
}

/* ===== SETTINGS ===== */
.settings-group {
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 16px;
  overflow: hidden;
}
.settings-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.settings-item:last-child {
  border-bottom: none;
}
.settings-item label {
  font-size: 14px;
}
.toggle {
  width: 48px;
  height: 28px;
  background: var(--bg-elevated);
  border-radius: 14px;
  position: relative;
  cursor: pointer;
  transition: background 0.2s;
  border: 1px solid rgba(255,255,255,0.1);
}
.toggle.on {
  background: rgba(212,175,55,0.3);
  border-color: var(--gold);
}
.toggle::after {
  content: '';
  position: absolute;
  width: 22px;
  height: 22px;
  background: #fff;
  border-radius: 50%;
  top: 2px;
  left: 2px;
  transition: transform 0.2s;
}
.toggle.on::after {
  transform: translateX(20px);
  background: var(--gold);
}

/* ===== OVERLAYS & MODALS ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.overlay.active {
  display: flex;
}
.modal-content {
  background: var(--bg-main);
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.1);
  max-width: 420px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  padding: 24px;
  position: relative;
}
.modal-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--bg-elevated);
  border: none;
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  justify-content: flex-end;
}
.admin-login input {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-elevated);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: var(--text);
  font-size: 15px;
  margin: 16px 0 8px;
  outline: none;
}
.admin-login input:focus {
  border-color: var(--gold);
}
.admin-hint {
  font-size: 11px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 12px;
}

/* ===== PACK OPENING ===== */
#opening-overlay {
  background: #050508;
  flex-direction: column;
}
.opening-container {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
.pack-visual {
  width: 200px;
  height: 280px;
  border-radius: 12px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Orbitron', sans-serif;
  font-weight: 700;
  font-size: 18px;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  cursor: pointer;
}
.pack-visual.shake {
  animation: pack-shake 0.5s ease-in-out;
}
@keyframes pack-shake {
  0%, 100% { transform: rotate(0deg); }
  20% { transform: rotate(-6deg) scale(1.02); }
  40% { transform: rotate(6deg) scale(1.02); }
  60% { transform: rotate(-4deg); }
  80% { transform: rotate(4deg); }
}
.pack-visual.opened {
  transform: scale(0.3) translateY(-80px);
  opacity: 0;
}
.cards-reveal {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  min-height: 160px;
}
.cards-reveal .tcg-card {
  width: 110px;
  opacity: 0;
  transform: scale(0.6) translateY(40px);
  transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.cards-reveal .tcg-card.revealed {
  opacity: 1;

// ===== STORAGE LAYER (LocalStorage + IndexedDB for images) =====

const Storage = {
  DB_NAME: 'AetherforgeDB',
  DB_VERSION: 1,
  db: null,

  async init() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(this.DB_NAME, this.DB_VERSION);
      request.onerror = () => reject(request.error);
      request.onsuccess = () => {
        this.db = request.result;
        resolve();
      };
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('images')) {
          db.createObjectStore('images', { keyPath: 'id' });
        }
        if (!db.objectStoreNames.contains('customCards')) {
          db.createObjectStore('customCards', { keyPath: 'id' });
        }
      };
    });
  },

  // LocalStorage helpers
  get(key, fallback = null) {
    try {
      const raw = localStorage.getItem('aether_' + key);
      return raw ? JSON.parse(raw) : fallback;
    } catch {
      return fallback;
    }
  },

  set(key, value) {
    try {
      localStorage.setItem('aether_' + key, JSON.stringify(value));
    } catch (e) {
      console.warn('Storage full or error', e);
    }
  },

  // Image storage in IndexedDB
  async saveImage(id, dataUrl) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('images', 'readwrite');
      const store = tx.objectStore('images');
      store.put({ id, data: dataUrl, ts: Date.now() });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },

  async getImage(id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('images', 'readonly');
      const store = tx.objectStore('images');
      const req = store.get(id);
      req.onsuccess = () => resolve(req.result ? req.result.data : null);
      req.onerror = () => reject(req.error);
    });
  },

  async deleteImage(id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('images', 'readwrite');
      const store = tx.objectStore('images');
      store.delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },

  // Custom cards
  async saveCustomCard(card) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('customCards', 'readwrite');
      const store = tx.objectStore('customCards');
      store.put(card);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  },

  async getAllCustomCards() {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('customCards', 'readonly');
      const store = tx.objectStore('customCards');
      const req = store.getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  },

  async deleteCustomCard(id) {
    return new Promise((resolve, reject) => {
      const tx = this.db.transaction('customCards', 'readwrite');
      const store = tx.objectStore('customCards');
      store.delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
};

        creature: creature.name,
        type: creature.type,

// ===== VISUAL EFFECTS =====

const Effects = {
  // Apply 3D tilt + shine on mouse/touch move
  enableCardTilt(cardEl) {
    if (!cardEl) return;

    const handleMove = (e) => {
      const rect = cardEl.getBoundingClientRect();
      const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
      const y = (e.clientY || (e.touches && e.touches[0].clientY)) - rect.top;
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      const rotateX = ((y - centerY) / centerY) * -12;
      const rotateY = ((x - centerX) / centerX) * 12;

      cardEl.style.transform = `perspective(800px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.03)`;

      const shine = cardEl.querySelector('.card-shine');
      if (shine) {
        const px = (x / rect.width) * 100;
        const py = (y / rect.height) * 100;
        shine.style.background = `radial-gradient(circle at ${px}% ${py}%, rgba(255,255,255,0.45) 0%, transparent 55%)`;
        shine.style.opacity = '0.85';
      }
    };

    const reset = () => {
      cardEl.style.transform = '';
      const shine = cardEl.querySelector('.card-shine');
      if (shine) {
        shine.style.opacity = cardEl.classList.contains('holo') ? '0.7' : '0';
        shine.style.background = '';
      }
    };

    cardEl.addEventListener('mousemove', handleMove);
    cardEl.addEventListener('touchmove', handleMove, { passive: true });
    cardEl.addEventListener('mouseleave', reset);
    cardEl.addEventListener('touchend', reset);
  },

  // Create particle burst (glitter)
  sparkle(x, y, color = '#d4af37', count = 18) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.style.cssText = `
        position: fixed;
        left: ${x}px;
        top: ${y}px;
        width: ${4 + Math.random() * 6}px;
        height: ${4 + Math.random() * 6}px;
        background: ${color};
        border-radius: 50%;
        pointer-events: none;
        z-index: 999;
        box-shadow: 0 0 8px ${color};
      `;
      document.body.appendChild(p);

      const angle = Math.random() * Math.PI * 2;
      const dist = 40 + Math.random() * 80;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist - 30;

      p.animate([
        { transform: 'translate(0,0) scale(1)', opacity: 1 },
        { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
      ], {
        duration: 600 + Math.random() * 400,
        easing: 'cubic-bezier(0.1, 0.8, 0.3, 1)'
      }).onfinish = () => p.remove();
    }
  },

  // Simple confetti for rare pulls
  confetti() {
    const colors = ['#d4af37', '#f0d878', '#7b5cff', '#ff6b9d', '#40e0d0', '#fff'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      const color = colors[Math.floor(Math.random() * colors.length)];
      p.style.cssText = `
        position: fixed;
        left: ${20 + Math.random() * 60}vw;
        top: -20px;
        width: ${6 + Math.random() * 8}px;
        height: ${6 + Math.random() * 10}px;
        background: ${color};
        border-radius: 2px;
        pointer-events: none;
        z-index: 998;
        opacity: 0.9;
      `;
      document.body.appendChild(p);
      const duration = 1500 + Math.random() * 1500;
      p.animate([
        { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
        { transform: `translateY(100vh) rotate(${360 + Math.random() * 360}deg)`, opacity: 0 }
      ], {
        duration,
        easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)'
      }).onfinish = () => p.remove();
    }
  }
};


// ===== AETHERFORGE MAIN APPLICATION =====

const App = {
  state: {
    coins: 5000,
    collection: {},          // cardId -> count
    favorites: [],
    binders: [],
    packs: [],
    cards: [],               // all available cards (base + custom)
    stats: {
      packsOpened: 0,
      cardsPulled: 0,
      rarePulls: 0,
      holoPulls: 0,
      cardsSold: 0,
      totalSpent: 0,
      totalEarned: 0,
      rarestPull: null,
      binderPages: 0
    },
    tasks: [],
    settings: {
      sound: true,
      animations: true,
      skipAnim: false,
      effects: true
    },
    recentPulls: [],
    forceNext: null,         // admin force pull
    infiniteCoins: false,
    adminUnlocked: false
  },

  currentView: 'home',
  openingInProgress: false,

  async init() {
    try {
      await Storage.init();
      this.loadState();
      this.ensureBaseData();
      await this.loadCustomCards();
      this.setupDailyTasks();
      this.bindEvents();
      this.render();
      document.getElementById('loading-screen').classList.remove('active');
      document.getElementById('main-app').classList.add('active');
      this.toast('Willkommen bei Aetherforge!', 'success');
    } catch (e) {
      console.error(e);
      document.querySelector('.loader-sub').textContent = 'Fehler beim Laden';
    }
  },

  ensureBaseData() {
    if (!this.state.packs.length) {
      this.state.packs = JSON.parse(JSON.stringify(DEFAULT_PACKS));
    }
    if (!this.state.cards.length) {
      this.state.cards = [...BASE_CARDS];
    }
    if (!this.state.binders.length) {
      this.state.binders = [
        { id: 'main', name: 'Hauptsammlung', cover: '#1a1a22', pages: [Array(9).fill(null)] },
        { id: 'legendary', name: 'Legendary Binder', cover: '#2a1520', pages: [Array(9).fill(null)] },
        { id: 'gold', name: 'Goldkarten', cover: '#2a2210', pages: [Array(9).fill(null)] },
        { id: 'holo', name: 'Holo-Sammlung', cover: '#152a2a', pages: [Array(9).fill(null)] }
      ];
    }
  },

  async loadCustomCards() {
    try {
      const customs = await Storage.getAllCustomCards();
      // Merge custom cards into cards array (replace if same id)
      customs.forEach(c => {
        const idx = this.state.cards.findIndex(x => x.id === c.id);
        if (idx >= 0) this.state.cards[idx] = c;
        else this.state.cards.push(c);
      });
    } catch (e) {
      console.warn('Could not load custom cards', e);
    }
  },

  loadState() {
    const saved = Storage.get('state');
    if (saved) {
      Object.assign(this.state, saved);
      // Ensure required structures exist
      if (!this.state.stats) this.state.stats = {};
      if (!this.state.settings) this.state.settings = { sound: true, animations: true, skipAnim: false, effects: true };
      if (!this.state.collection) this.state.collection = {};
      if (!this.state.recentPulls) this.state.recentPulls = [];
    }
  },

  saveState() {
    // Don't save full cards array every time (too big) – custom cards are in IndexedDB
    const toSave = {
      coins: this.state.coins,
      collection: this.state.collection,
      favorites: this.state.favorites,
      binders: this.state.binders,
      packs: this.state.packs,
      stats: this.state.stats,
      tasks: this.state.tasks,
      settings: this.state.settings,
      recentPulls: this.state.recentPulls.slice(0, 20),
      forceNext: this.state.forceNext,
      infiniteCoins: this.state.infiniteCoins,
      adminUnlocked: this.state.adminUnlocked
    };
    Storage.set('state', toSave);
  },

  // ===== NAVIGATION =====
  navigate(view) {
    this.currentView = view;
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === view);
    });
    this.render();
  },

  bindEvents() {
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => this.navigate(btn.dataset.view));
    });

    document.getElementById('btn-settings').addEventListener('click', () => {
      this.navigate('settings');
    });

    document.getElementById('close-card-modal').addEventListener('click', () => {
      document.getElementById('card-modal').classList.remove('active');
    });

    document.getElementById('cancel-admin-login').addEventListener('click', () => {
      document.getElementById('admin-login-modal').classList.remove('active');
    });

    document.getElementById('confirm-admin-login').addEventListener('click', () => {
      const pw = document.getElementById('admin-password').value;
      if (pw === 'aether2026') {
        this.state.adminUnlocked = true;
        this.saveState();
        document.getElementById('admin-login-modal').classList.remove('active');
        this.navigate('admin');
        this.toast('Admin-Modus aktiviert', 'success');
      } else {
        this.toast('Falsches Passwort', 'error');
      }
    });

    document.getElementById('btn-skip-anim').addEventListener('click', () => {
      if (this.openingInProgress) this.finishOpening(true);
    });

    document.getElementById('btn-continue-opening').addEventListener('click', () => {
      document.getElementById('opening-overlay').classList.remove('active');
      this.openingInProgress = false;
      this.render();
    });
  },

  // ===== RENDERING =====
  render() {
    this.updateCoins();
    const content = document.getElementById('content');
    switch (this.currentView) {
      case 'home': content.innerHTML = this.renderHome(); break;
      case 'shop': content.innerHTML = this.renderShop(); break;
      case 'collection': content.innerHTML = this.renderCollection(); break;
      case 'binder': content.innerHTML = this.renderBinder(); break;
      case 'market': content.innerHTML = this.renderMarket(); break;
      case 'stats': content.innerHTML = this.renderStats(); break;
      case 'tasks': content.innerHTML = this.renderTasks(); break;
      case 'settings': content.innerHTML = this.renderSettings(); break;
      case 'admin': content.innerHTML = this.renderAdmin(); break;
      default: content.innerHTML = this.renderHome();
    }
    this.attachViewEvents();
  },

  updateCoins() {
    const el = document.getElementById('coin-amount');
    if (el) el.textContent = this.formatNumber(this.state.coins);
  },

  formatNumber(n) {
    return n.toLocaleString('de-DE');
  },

  getCard(id) {
    return this.state.cards.find(c => c.id === id);
  },

  getOwnedCount(id) {
    return this.state.collection[id] || 0;
  },

  getUniqueCount() {
    return Object.keys(this.state.collection).filter(id => this.state.collection[id] > 0).length;
  },

  getTotalCards() {
    return Object.values(this.state.collection).reduce((a, b) => a + b, 0);
  },

  getCollectionValue() {
    let total = 0;
    for (const [id, count] of Object.entries(this.state.collection)) {
      const card = this.getCard(id);
      if (card) total += card.value * count;
    }
    return total;
  },

  // ===== HOME =====
  renderHome() {
    const unique = this.getUniqueCount();
    const totalPossible = this.state.cards.length;
    const progress = totalPossible ? Math.min(100, (unique / totalPossible) * 100) : 0;
    const recent = this.state.recentPulls.slice(0, 8);

    return `
      <div class="home-header">
        <div class="welcome-text">Willkommen, Sammler</div>
        <div style="color:var(--text-dim);font-size:13px;">Dein Aetherforge-Reich</div>
      </div>

      <div class="stat-row">
        <div class="stat-box">
          <div class="stat-value">${this.formatNumber(this.state.coins)}</div>
          <div class="stat-label">Coins</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${this.getTotalCards()}</div>
          <div class="stat-label">Karten</div>
        </div>
        <div class="stat-box">
          <div class="stat-value">${unique}</div>
          <div class="stat-label">Einzigartig</div>
        </div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-label">
          <span>Sammlungsfortschritt</span>
          <span>${unique} / ${totalPossible}</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" style="width:${progress}%"></div>
        </div>
      </div>

      <div class="section-title" style="margin-top:20px">Letzte Pulls</div>
      ${recent.length ? `
        <div class="recent-pulls">
          ${recent.map(id => this.renderMiniCard(id)).join('')}
        </div>
      ` : `<div class="empty-state"><div class="icon">✦</div>Noch keine Karten gezogen</div>`}

      <div style="margin-top:24px;display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn-primary" onclick="App.navigate('shop')">Packs öffnen</button>
        <button class="btn-secondary" onclick="App.navigate('tasks')">Aufgaben</button>
        <button class="btn-secondary" onclick="App.openAdminLogin()">Admin</button>
      </div>
    `;
  },

  renderMiniCard(cardId) {
    const card = this.getCard(cardId);
    if (!card) return '';
    return `<div class="tcg-card ${card.isHolo ? 'holo' : ''} ${card.isGold ? 'gold-border' : ''} ${card.isRainbow ? 'rainbow-border' : ''}" 
      style="width:90px" onclick="App.showCardDetail('${card.id}')">
      <div class="card-bg" style="background:${this.getCardBackground(card)}"></div>
      <div class="card-shine"></div>
      <div class="card-rarity rarity-${card.rarity}">${card.rarityName.substring(0, 3)}</div>
      <div class="card-name">${card.name}</div>
    </div>`;
  },

  getCardBackground(card) {
    if (card.artwork) return `url(${card.artwork}) center/cover`;
    // Procedural colors based on element / rarity
    const elementColors = {
      Fire: 'linear-gradient(145deg, #5a2020, #2a0a0a)',
      Storm: 'linear-gradient(145deg, #203a5a, #0a1a2a)',
      Crystal: 'linear-gradient(145deg, #3a2a5a, #1a1030)',
      Nature: 'linear-gradient(145deg, #1a3a2a, #0a1a10)',
      Void: 'linear-gradient(145deg, #1a1a2a, #0a0a14)',
      Aether: 'linear-gradient(145deg, #2a2a4a, #101028)',
      Metal: 'linear-gradient(145deg, #3a3a40, #1a1a1e)',
      Moon: 'linear-gradient(145deg, #2a2a3a, #12121c)',
      Ice: 'linear-gradient(145deg, #1a3a4a, #0a1a24)',
      Shadow: 'linear-gradient(145deg, #1a1020, #0a0610)',
      Light: 'linear-gradient(145deg, #4a4a2a, #2a2a10)',
      Cosmic: 'linear-gradient(145deg, #2a1a4a, #120a24)',
      Water: 'linear-gradient(145deg, #1a2a4a, #0a1424)',
      Earth: 'linear-gradient(145deg, #3a2a1a, #1a1008)',
      Spirit: 'linear-gradient(145deg, #2a3a3a, #101a1a)',
      Illusion: 'linear-gradient(145deg, #3a2a4a, #1a1024)',
      Neutral: 'linear-gradient(145deg, #2a2a2a, #141414)'
    };
    return elementColors[card.element] || elementColors.Neutral;
  },

  // ===== SHOP =====
  renderShop() {
    return `
      <div class="section-title">Booster Shop</div>
      <div class="shop-grid">
        ${this.state.packs.filter(p => !p.disabled).map(pack => `
          <div class="pack-card" onclick="App.buyPack('${pack.id}')">
            <div class="pack-visual-preview" style="background:${pack.color}">
              <span style="font-family:Orbitron;font-size:13px;letter-spacing:1px;z-index:1;position:relative">${pack.name}</span>
            </div>
            <div class="pack-info">
              <div class="pack-name">${pack.name}</div>
              <div class="pack-price"><span class="coin-icon">◉</span> ${this.formatNumber(pack.price)}</div>
              <div class="pack-rarity-hint">${pack.cards} Karten · ${pack.guaranteed[0] || 'mixed'}</div>
            </div>
          </div>
        `).join('')}
      </div>
    `;
  },

  buyPack(packId) {
    const pack = this.state.packs.find(p => p.id === packId);
    if (!pack) return;

    if (!this.state.infiniteCoins && this.state.coins < pack.price) {
      this.toast('Nicht genug Coins!', 'error');
      return;
    }

    if (!this.state.infiniteCoins) {
      this.state.coins -= pack.price;
      this.state.stats.totalSpent = (this.state.stats.totalSpent || 0) + pack.price;
    }

    this.updateCoins();
    this.startOpening(pack);
  },

  // ===== PACK OPENING =====
  startOpening(pack) {
    this.openingInProgress = true;
    const overlay = document.getElementById('opening-overlay');
    const packVis = document.getElementById('pack-visual');
    const cardsReveal = document.getElementById('cards-reveal');
    const btnSkip = document.getElementById('btn-skip-anim');
    const btnContinue = document.getElementById('btn-continue-opening');

    cardsReveal.innerHTML = '';
    btnContinue.classList.add('hidden');
    btnSkip.classList.remove('hidden');

    packVis.style.background = pack.color;
    packVis.style.border = `2px solid ${pack.accent}`;
    packVis.textContent = pack.name;
    packVis.className = 'pack-visual';
    packVis.style.opacity = '1';
    packVis.style.transform = '';

    overlay.classList.add('active');

    // Generate cards first
    this.pendingCards = this.generatePull(pack);

    if (this.state.settings.skipAnim) {
      this.finishOpening(true);
      return;
    }

    // Animation sequence
    setTimeout(() => {
      packVis.classList.add('shake');
      if (this.state.settings.effects) {
        Effects.sparkle(window.innerWidth / 2, window.innerHeight / 2 - 40, pack.accent, 12);
      }
    }, 400);

    setTimeout(() => {
      packVis.classList.add('opened');
      this.revealCardsOneByOne();
    }, 1100);
  },

  generatePull(pack) {
    const results = [];
    const rates = pack.rates || {};

    // Guarantee
    if (pack.guaranteed && pack.guaranteed.length) {
      pack.guaranteed.forEach(r => {
        results.push(this.pickCardOfRarity(r));
      });
    }

    // Fill remaining
    const remaining = pack.cards - results.length;
    for (let i = 0; i < remaining; i++) {
      if (this.state.forceNext) {
        const forced = this.getCard(this.state.forceNext) || this.pickCardOfRarity(this.state.forceNext);
        results.push(forced);
        this.state.forceNext = null;
      } else {
        const rarity = this.rollRarity(rates);
        results.push(this.pickCardOfRarity(rarity));
      }
    }

    return results.filter(Boolean);
  },

  rollRarity(rates) {
    const entries = Object.entries(rates);
    const total = entries.reduce((s, [, w]) => s + w, 0);
    let r = Math.random() * total;
    for (const [rarity, weight] of entries) {
      r -= weight;
      if (r <= 0) return rarity;
    }
    return entries[0][0];
  },

  pickCardOfRarity(rarityId) {
    // If forceNext is a card id
    if (typeof rarityId === 'string' && rarityId.startsWith('card_')) {
      return this.getCard(rarityId);
    }
    const pool = this.state.cards.filter(c => c.rarity === rarityId);
    if (!pool.length) {
      // fallback
      const all = this.state.cards;
      return all[Math.floor(Math.random() * all.length)];
    }
    return pool[Math.floor(Math.random() * pool.length)];
  },

  revealCardsOneByOne() {
    const container = document.getElementById('cards-reveal');
    const cards = this.pendingCards;
    let i = 0;

    const showNext = () => {
      if (i >= cards.length) {
        this.finishOpening(false);
        return;
      }
      const card = cards[i];
      const el = document.createElement('div');
      el.className = `tcg-card ${card.isHolo ? 'holo' : ''} ${card.isGold ? 'gold-border' : ''} ${card.isRainbow ? 'rainbow-border' : ''}`;
      el.innerHTML = `
        <div class="card-bg" style="background:${this.getCardBackground(card)}"></div>
        <div class="card-shine"></div>
        <div class="card-rarity rarity-${card.rarity}">${card.rarityName}</div>
        <div class="card-name">${card.name}</div>
      `;
      el.onclick = () => this.showCardDetail(card.id);
      container.appendChild(el);

      requestAnimationFrame(() => {
        el.classList.add('revealed');
        if (['ultra', 'illustration', 'special', 'hyper', 'secret'].includes(card.rarity)) {
          el.classList.add('special-reveal');
          if (this.state.settings.effects) {
            Effects.sparkle(el.getBoundingClientRect().left + 55, el.getBoundingClientRect().top + 70, '#d4af37', 20);
            if (['hyper', 'secret'].includes(card.rarity)) Effects.confetti();
          }
        }
      });

      i++;
      setTimeout(showNext, this.state.settings.animations ? 380 : 80);
    };

    showNext();
  },

  finishOpening(skip) {
    const cards = this.pendingCards || [];
    // Add to collection
    cards.forEach(card => {
      this.state.collection[card.id] = (this.state.collection[card.id] || 0) + 1;
      this.state.recentPulls.unshift(card.id);
      this.state.stats.cardsPulled = (this.state.stats.cardsPulled || 0) + 1;

      if (['rare', 'double', 'ultra', 'illustration', 'special', 'hyper', 'secret'].includes(card.rarity)) {
        this.state.stats.rarePulls = (this.state.stats.rarePulls || 0) + 1;
      }
      if (card.isHolo) {
        this.state.stats.holoPulls = (this.state.stats.holoPulls || 0) + 1;
      }

      // Track rarest
      const order = RARITIES.map(r => r.id);
      if (!this.state.stats.rarestPull || order.indexOf(card.rarity) > order.indexOf(this.getCard(this.state.stats.rarestPull)?.rarity || 'common')) {
        this.state.stats.rarestPull = card.id;
      }
    });

    this.state.stats.packsOpened = (this.state.stats.packsOpened || 0) + 1;
    this.state.recentPulls = this.state.recentPulls.slice(0, 30);
    this.updateTasks();
    this.saveState();

    if (skip) {
      // Instant show all
      const container = document.getElementById('cards-reveal');
      container.innerHTML = '';
      cards.forEach(card => {
        const el = document.createElement('div');
        el.className = `tcg-card revealed ${card.isHolo ? 'holo' : ''} ${card.isGold ? 'gold-border' : ''} ${card.isRainbow ? 'rainbow-border' : ''}`;
        el.innerHTML = `
          <div class="card-bg" style="background:${this.getCardBackground(card)}"></div>
          <div class="card-shine"></div>
          <div class="card-rarity rarity-${card.rarity}">${card.rarityName}</div>
          <div class="card-name">${card.name}</div>
        `;
        el.onclick = () => this.showCardDetail(card.id);
        container.appendChild(el);
      });
      document.getElementById('pack-visual').classList.add('opened');
    }

    document.getElementById('btn-skip-anim').classList.add('hidden');
    document.getElementById('btn-continue-opening').classList.remove('hidden');
    this.toast(`${cards.length} Karten erhalten!`, 'success');
  },

  // ===== COLLECTION =====
  renderCollection() {
    const ownedIds = Object.keys(this.state.collection).filter(id => this.state.collection[id] > 0);
    const filter = this._collectionFilter || 'all';
    const search = (this._collectionSearch || '').toLowerCase();

    let list = ownedIds.map(id => this.getCard(id)).filter(Boolean);
    if (filter !== 'all') list = list.filter(c => c.rarity === filter);
    if (search) list = list.filter(c => c.name.toLowerCase().includes(search) || (c.creature || '').toLowerCase().includes(search));

    list.sort((a, b) => b.value - a.value);

    return `
      <div class="section-title">Meine Sammlung (${ownedIds.length})</div>
      <input class="search-input" type="search" placeholder="Karte suchen..." value="${this._collectionSearch || ''}" 
        oninput="App._collectionSearch=this.value;App.render()" />
      <div class="filter-bar">
        <div class="filter-chip ${filter==='all'?'active':''}" onclick="App._collectionFilter='all';App.render()">Alle</div>
        ${RARITIES.map(r => `
          <div class="filter-chip ${filter===r.id?'active':''}" onclick="App._collectionFilter='${r.id}';App.render()">${r.name}</div>
        `).join('')}
      </div>
      ${list.length ? `
        <div class="card-grid">
          ${list.map(card => `
            <div style="position:relative">
              ${this.renderMiniCard(card.id)}
              <div style="text-align:center;font-size:11px;color:var(--text-muted);margin-top:4px">×${this.getOwnedCount(card.id)}</div>
            </div>
          `).join('')}
        </div>
      ` : `<div class="empty-state"><div class="icon">▤</div>Keine Karten in diesem Filter</div>`}
    `;
  },

  // ===== BINDER =====
  renderBinder() {
    const binderId = this._currentBinder || 'main';
    const binder = this.state.binders.find(b => b.id === binderId) || this.state.binders[0];
    const pageIdx = this._binderPage || 0;
    const page = binder.pages[pageIdx] || Array(9).fill(null);

    return `
      <div class="section-title">Binder</div>
      <div class="binder-tabs">
        ${this.state.binders.map(b => `
          <div class="filter-chip ${b.id===binderId?'active':''}" onclick="App._currentBinder='${b.id}';App._binderPage=0;App.render()">${b.name}</div>
        `).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <button class="btn-secondary" style="padding:6px 12px" onclick="App.changeBinderPage(-1)" ${pageIdx<=0?'disabled':''}>←</button>
        <span style="font-size:13px;color:var(--text-dim)">Seite ${pageIdx+1} / ${binder.pages.length}</span>
        <button class="btn-secondary" style="padding:6px 12px" onclick="App.changeBinderPage(1)">→</button>
      </div>
      <div class="binder-page">
        <div class="binder-grid">
          ${page.map((slot, i) => `
            <div class="binder-slot ${slot?'filled':''}" onclick="App.binderSlotClick('${binderId}',${pageIdx},${i})">
              ${slot ? this.renderMiniCard(slot) : '<span style="color:var(--text-muted);font-size:20px">+</span>'}
            </div>
          `).join('')}
        </div>
      </div>
      <div style="margin-top:12px;font-size:12px;color:var(--text-muted)">
        Tippe auf einen leeren Slot und wähle danach eine Karte aus der Sammlung.
      </div>
    `;
  },

  changeBinderPage(dir) {
    const binder = this.state.binders.find(b => b.id === (this._currentBinder || 'main'));
    if (!binder) return;
    let page = (this._binderPage || 0) + dir;
    if (page < 0) return;
    if (page >= binder.pages.length) {
      binder.pages.push(Array(9).fill(null));
    }
    this._binderPage = page;
    this.saveState();
    this.render();
  },

  binderSlotClick(binderId, pageIdx, slotIdx) {
    const binder = this.state.binders.find(b => b.id === binderId);
    if (!binder) return;
    const current = binder.pages[pageIdx][slotIdx];

    if (current) {
      // Remove
      binder.pages[pageIdx][slotIdx] = null;
      this.saveState();
      this.render();
      this.toast('Karte aus Binder entfernt');
      return;
    }

    // Choose card
    const owned = Object.keys(this.state.collection).filter(id => this.state.collection[id] > 0);
    if (!owned.length) {
      this.toast('Keine Karten in der Sammlung', 'error');
      return;
    }

    // Simple picker via prompt for now (can be improved later)
    const names = owned.map(id => {
      const c = this.getCard(id);
      return c ? `${c.name} (${c.rarityName})` : id;
    });
    const choice = prompt('Karten-ID eingeben oder Index (0-' + (owned.length-1) + '):\n' + names.slice(0,15).join('\n') + (names.length>15?'\n...':''));
    if (choice === null) return;

    let cardId = choice;
    if (!isNaN(parseInt(choice))) {
      cardId = owned[parseInt(choice)];
    }
    if (!this.getCard(cardId) || !this.state.collection[cardId]) {
      this.toast('Ungültige Karte', 'error');
      return;
    }

    binder.pages[pageIdx][slotIdx] = cardId;
    // Check full page
    if (binder.pages[pageIdx].every(s => s)) {
      this.state.stats.binderPages = (this.state.stats.binderPages || 0) + 1;
      this.updateTasks();
      this.toast('Binder-Seite vervollständigt! +Aufgabe', 'success');
    }
    this.saveState();
    this.render();
  },

  // ===== MARKET =====
  renderMarket() {
    const owned = Object.entries(this.state.collection)
      .filter(([, count]) => count > 0)
      .map(([id, count]) => ({ card: this.getCard(id), count }))
      .filter(x => x.card)
      .sort((a, b) => b.card.value - a.card.value);

    return `
      <div class="section-title">Kartenmarkt</div>
      <p style="font-size:13px;color:var(--text-dim);margin-bottom:14px">Verkaufe doppelte oder ungewollte Karten für Coins.</p>
      ${owned.length ? owned.map(({ card, count }) => `
        <div class="market-item">
          <div class="tcg-card ${card.isHolo?'holo':''}" style="width:56px" onclick="App.showCardDetail('${card.id}')">
            <div class="card-bg" style="background:${this.getCardBackground(card)}"></div>
            <div class="card-shine"></div>
          </div>
          <div class="market-info">
            <div class="market-name">${card.name}</div>
            <div class="market-meta">${card.rarityName} · ×${count}</div>
          </div>
          <div style="text-align:right">
            <div class="market-price">◉ ${this.formatNumber(card.value)}</div>
            <button class="btn-secondary" style="padding:5px 10px;font-size:11px;margin-top:4px" 
              onclick="App.sellCard('${card.id}')">Verkaufen</button>
          </div>
        </div>
      `).join('') : `<div class="empty-state"><div class="icon">⇄</div>Keine Karten zum Verkaufen</div>`}
    `;
  },

  sellCard(cardId) {
    const count = this.state.collection[cardId] || 0;
    if (count < 1) return;
    const card = this.getCard(cardId);
    if (!card) return;

    this.state.collection[cardId] = count - 1;
    if (this.state.collection[cardId] <= 0) delete this.state.collection[cardId];

    this.state.coins += card.value;
    this.state.stats.cardsSold = (this.state.stats.cardsSold || 0) + 1;
    this.state.stats.totalEarned = (this.state.stats.totalEarned || 0) + card.value;
    this.updateTasks();
    this.saveState();
    this.updateCoins();
    this.render();
    this.toast(`+${this.formatNumber(card.value)} Coins`, 'success');
  },

  // ===== STATS =====
  renderStats() {
    const s = this.state.stats;
    const rarest = s.rarestPull ? this.getCard(s.rarestPull) : null;
    return `
      <div class="section-title">Statistiken</div>
      <div class="stats-grid">
        <div class="stats-card"><div class="label">Packs geöffnet</div><div class="value">${s.packsOpened||0}</div></div>
        <div class="stats-card"><div class="label">Karten gezogen</div><div class="value">${s.cardsPulled||0}</div></div>
        <div class="stats-card"><div class="label">Rare+ Pulls</div><div class="value">${s.rarePulls||0}</div></div>
        <div class="stats-card"><div class="label">Holo Pulls</div><div class="value">${s.holoPulls||0}</div></div>
        <div class="stats-card"><div class="label">Karten verkauft</div><div class="value">${s.cardsSold||0}</div></div>
        <div class="stats-card"><div class="label">Gesamtwert</div><div class="value">${this.formatNumber(this.getCollectionValue())}</div></div>
        <div class="stats-card"><div class="label">Einzigartige</div><div class="value">${this.getUniqueCount()}</div></div>
        <div class="stats-card"><div class="label">Binder-Seiten</div><div class="value">${s.binderPages||0}</div></div>
      </div>
      ${rarest ? `
        <div class="section-title" style="margin-top:20px">Seltenster Pull</div>
        <div style="display:flex;justify-content:center;margin-top:10px">
          ${this.renderMiniCard(rarest.id)}
        </div>
        <div style="text-align:center;margin-top:8px;font-size:13px">${rarest.name} · ${rarest.rarityName}</div>
      ` : ''}
    `;
  },

  // ===== TASKS =====
  setupDailyTasks() {
    const today = new Date().toDateString();
    if (this.state.tasks.length && this.state.tasks[0].date === today) return;

    // Pick 4 random tasks
    const shuffled = [...TASK_TEMPLATES].sort(() => Math.random() - 0.5).slice(0, 4);
    this.state.tasks = shuffled.map(t => ({
      ...t,
      date: today,
      progress: 0,
      claimed: false
    }));
    this.saveState();
  },

  updateTasks() {
    const s = this.state.stats;
    this.state.tasks.forEach(task => {
      if (task.claimed) return;
      let val = 0;
      switch (task.type) {
        case 'packsOpened': val = s.packsOpened || 0; break;
        case 'rarePulls': val = s.rarePulls || 0; break;
        case 'holoPulls': val = s.holoPulls || 0; break;
        case 'uniqueCards': val = this.getUniqueCount(); break;
        case 'cardsSold': val = s.cardsSold || 0; break;
        case 'binderPages': val = s.binderPages || 0; break;
      }
      // For daily we track session progress differently – simplified: use absolute for now
      task.progress = Math.min(task.target, val);
    });
    this.saveState();
  },

  claimTask(taskId) {
    const task = this.state.tasks.find(t => t.id === taskId);
    if (!task || task.claimed || task.progress < task.target) return;
    task.claimed = true;
    this.state.coins += task.reward;
    this.state.stats.totalEarned = (this.state.stats.totalEarned || 0) + task.reward;
    this.saveState();
    this.updateCoins();
    this.render();
    this.toast(`+${task.reward} Coins erhalten!`, 'success');
  },

  renderTasks() {
    this.updateTasks();
    return `
      <div class="section-title">Tägliche Aufgaben</div>
      ${this.state.tasks.map(task => `
        <div class="task-item ${task.claimed?'completed':''}">
          <div class="task-info">
            <div class="task-title">${task.title}</div>
            <div class="task-progress">${Math.min(task.progress, task.target)} / ${task.target}</div>
          </div>
          <div class="task-reward">+${task.reward}</div>
          ${!task.claimed && task.progress >= task.target ? 
            `<button class="btn-primary" style="padding:6px 12px;font-size:12px" onclick="App.claimTask('${task.id}')">Abholen</button>` : 
            task.claimed ? '<span style="color:var(--success);font-size:12px">✓</span>' : ''}
        </div>
      `).join('')}
      <div style="margin-top:20px">
        <button class="btn-secondary" onclick="App.navigate('home')">Zurück</button>
      </div>
    `;
  },

  // ===== SETTINGS =====
  renderSettings() {
    const s = this.state.settings;
    return `
      <div class="section-title">Einstellungen</div>
      <div class="settings-group">
        <div class="settings-item">
          <label>Animationen</label>
          <div class="toggle ${s.animations?'on':''}" onclick="App.toggleSetting('animations')"></div>
        </div>
        <div class="settings-item">
          <label>Animationen überspringen</label>
          <div class="toggle ${s.skipAnim?'on':''}" onclick="App.toggleSetting('skipAnim')"></div>
        </div>
        <div class="settings-item">
          <label>Grafikeffekte (Glitzer etc.)</label>
          <div class="toggle ${s.effects?'on':''}" onclick="App.toggleSetting('effects')"></div>
        </div>
        <div class="settings-item">
          <label>Sound (Platzhalter)</label>
          <div class="toggle ${s.sound?'on':''}" onclick="App.toggleSetting('sound')"></div>
        </div>
      </div>
      <div class="settings-group">
        <div class="settings-item">
          <label>Admin-Panel öffnen</label>
          <button class="btn-secondary" style="padding:6px 14px" onclick="App.openAdminLogin()">Admin</button>
        </div>
        <div class="settings-item">
          <label>Spielstand zurücksetzen</label>
          <button class="btn-danger" onclick="App.resetGame()">Zurücksetzen</button>
        </div>
      </div>
      <div style="margin-top:20px;font-size:12px;color:var(--text-muted);text-align:center">
        Aetherforge v1.0 · Original TCG Simulator<br>
        Alle Kreaturen und Designs sind fiktiv.
      </div>
    `;
  },

  toggleSetting(key) {
    this.state.settings[key] = !this.state.settings[key];
    this.saveState();
    this.render();
  },

  resetGame() {
    if (!confirm('Wirklich den gesamten Spielstand löschen? Dies kann nicht rückgängig gemacht werden.')) return;
    localStorage.removeItem('aether_state');
    location.reload();
  },

  openAdminLogin() {
    if (this.state.adminUnlocked) {
      this.navigate('admin');
      return;
    }
    document.getElementById('admin-password').value = '';
    document.getElementById('admin-login-modal').classList.add('active');
  },

  // ===== CARD DETAIL =====
  showCardDetail(cardId) {
    const card = this.getCard(cardId);
    if (!card) return;
    const count = this.getOwnedCount(cardId);
    const content = document.getElementById('card-detail-content');
    content.innerHTML = `
      <div style="display:flex;justify-content:center;margin-bottom:16px">
        <div class="tcg-card ${card.isHolo?'holo':''} ${card.isGold?'gold-border':''} ${card.isRainbow?'rainbow-border':''}" style="width:180px" id="detail-card">
          <div class="card-bg" style="background:${this.getCardBackground(card)}"></div>
          <div class="card-shine"></div>
          <div class="card-rarity rarity-${card.rarity}">${card.rarityName}</div>
          <div class="card-name">${card.name}</div>
        </div>
      </div>
      <h3 style="text-align:center;margin-bottom:4px">${card.name}</h3>
      <div style="text-align:center;font-size:13px;color:var(--text-dim);margin-bottom:12px">
        ${card.creature || card.pokemon} · ${card.type} · ${card.element || ''}
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px">
        <div><span style="color:var(--text-muted)">Seltenheit</span><br><strong>${card.rarityName}</strong></div>
        <div><span style="color:var(--text-muted)">Wert</span><br><strong style="color:var(--gold)">◉ ${this.formatNumber(card.value)}</strong></div>
        <div><span style="color:var(--text-muted)">Besitz</span><br><strong>×${count}</strong></div>
        <div><span style="color:var(--text-muted)">Style</span><br><strong>${card.styleName || card.style}</strong></div>
      </div>
      <p style="margin-top:14px;font-size:13px;color:var(--text-dim)">${card.description || ''}</p>
      <div style="margin-top:16px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
        ${count > 0 ? `<button class="btn-secondary" onclick="App.sellCard('${card.id}');document.getElementById('card-modal').classList.remove('active')">Verkaufen</button>` : ''}
        <button class="btn-secondary" onclick="document.getElementById('card-modal').classList.remove('active')">Schließen</button>
      </div>
    `;
    document.getElementById('card-modal').classList.add('active');
    setTimeout(() => {
      const el = document.getElementById('detail-card');
      if (el && this.state.settings.effects) Effects.enableCardTilt(el);
    }, 50);
  },

  // ===== TOAST =====
  toast(msg, type = '') {
    const container = document.getElementById('toast-container');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    container.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transition = 'opacity 0.3s';
      setTimeout(() => el.remove(), 300);
    }, 2600);
  },

  attachViewEvents() {
    // Re-attach tilt to visible cards if needed
    if (this.state.settings.effects) {
      document.querySelectorAll('.tcg-card').forEach(el => {
        Effects.enableCardTilt(el);
      });
    }
  }
};

// ===== ADMIN ACTIONS =====

App.adminAddCoins = function() {
  const amount = parseInt(document.getElementById('admin-coin-amount').value) || 0;
  this.state.coins = Math.max(0, this.state.coins + amount);
  this.saveState();
  this.updateCoins();
  this.toast(`${amount >= 0 ? '+' : ''}${amount} Coins`, 'success');
};

App.adminSetCoins = function(amount) {
  this.state.coins = amount;
  this.saveState();
  this.updateCoins();
  this.toast(`Coins auf ${this.formatNumber(amount)} gesetzt`, 'success');
};

App.adminToggleInfinite = function() {
  this.state.infiniteCoins = !this.state.infiniteCoins;
  this.saveState();
  this.render();
  this.toast(this.state.infiniteCoins ? 'Unendlich Coins aktiviert' : 'Unendlich Coins deaktiviert');
};

App.adminCreateCard = async function() {
  const name = document.getElementById('ac-name').value.trim();
  if (!name) {
    this.toast('Name erforderlich', 'error');
    return;
  }

  const creature = document.getElementById('ac-creature').value.trim() || name;
  let id = document.getElementById('ac-id').value.trim() || `card_custom_${Date.now()}`;
  const rarity = document.getElementById('ac-rarity').value;
  const type = document.getElementById('ac-type').value;
  const element = document.getElementById('ac-element').value.trim() || 'Aether';
  const value = parseInt(document.getElementById('ac-value').value) || 100;
  const desc = document.getElementById('ac-desc').value.trim();
  const style = document.getElementById('ac-style').value;
  const action = document.getElementById('ac-action').value;

  const rarityObj = RARITIES.find(r => r.id === rarity) || RARITIES[0];
  const styleObj = ARTWORK_STYLES.find(s => s.id === style) || ARTWORK_STYLES[0];

  let artwork = null;
  const fileInput = document.getElementById('ac-artwork');
  if (fileInput.files && fileInput.files[0]) {
    artwork = await this.readFileAsDataURL(fileInput.files[0]);
    // Store in IndexedDB
    await Storage.saveImage(id, artwork);
  }

  const card = {
    id,
    name,
    pokemon: creature,
    creature,
    type,
    element,
    rarity,
    rarityName: rarityObj.name,
    style,
    styleName: styleObj.name,
    value,
    description: desc || `Eine einzigartige ${element} ${type}-Karte.`,
    isCustom: true,
    isHolo: ['reverse', 'fullart', 'gold', 'rainbow', 'secret', 'special'].includes(style),
    isGold: style === 'gold',
    isRainbow: style === 'rainbow' || rarity === 'secret',
    artwork
  };

  // Save to IndexedDB
  await Storage.saveCustomCard(card);

  // Add to runtime
  const existing = this.state.cards.findIndex(c => c.id === id);
  if (existing >= 0) this.state.cards[existing] = card;
  else this.state.cards.push(card);

  if (action === 'collection' || action === 'both') {
    this.state.collection[id] = (this.state.collection[id] || 0) + 1;
  }

  this.saveState();
  this.toast(`Karte "${name}" erstellt!`, 'success');
  this.render();
};

App.readFileAsDataURL = function(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
};

App.adminLoadCardToEdit = function() {
  const id = document.getElementById('am-card-select').value;
  const fields = document.getElementById('am-edit-fields');
  if (!id) {
    fields.style.display = 'none';
    return;
  }
  const card = this.getCard(id);
  if (!card) return;
  fields.style.display = 'block';
  document.getElementById('am-name').value = card.name;
  document.getElementById('am-value').value = card.value;
  document.getElementById('am-rarity').value = card.rarity;
};

App.adminUpdateCard = async function() {
  const id = document.getElementById('am-card-select').value;
  const card = this.getCard(id);
  if (!card) return;

  card.name = document.getElementById('am-name').value.trim() || card.name;
  card.value = parseInt(document.getElementById('am-value').value) || card.value;
  const rarity = document.getElementById('am-rarity').value;
  card.rarity = rarity;
  card.rarityName = (RARITIES.find(r => r.id === rarity) || {}).name || rarity;

  const fileInput = document.getElementById('am-artwork');
  if (fileInput.files && fileInput.files[0]) {
    card.artwork = await this.readFileAsDataURL(fileInput.files[0]);
    await Storage.saveImage(id, card.artwork);
  }

  if (card.isCustom) {
    await Storage.saveCustomCard(card);
  }

  this.saveState();
  this.toast('Karte aktualisiert', 'success');
  this.render();
};

App.adminAddToCollection = function(amount = 1) {
  const id = document.getElementById('am-card-select').value;
  if (!id) return;
  this.state.collection[id] = (this.state.collection[id] || 0) + amount;
  this.saveState();
  this.toast(`+${amount} zur Sammlung`, 'success');
};

App.adminDeleteCard = async function() {
  const id = document.getElementById('am-card-select').value;
  if (!id) return;
  if (!confirm('Karte wirklich löschen?')) return;

  this.state.cards = this.state.cards.filter(c => c.id !== id);
  delete this.state.collection[id];
  await Storage.deleteCustomCard(id);
  await Storage.deleteImage(id);
  this.saveState();
  this.toast('Karte gelöscht', 'success');
  this.render();
};

App.adminUpdatePackPrice = function() {
  const id = document.getElementById('ap-pack-select').value;
  const price = parseInt(document.getElementById('ap-price').value);
  const pack = this.state.packs.find(p => p.id === id);
  if (!pack || isNaN(price)) return;
  pack.price = price;
  this.saveState();
  this.toast('Preis aktualisiert', 'success');
  this.render();
};

App.adminTogglePack = function() {
  const id = document.getElementById('ap-pack-select').value;
  const pack = this.state.packs.find(p => p.id === id);
  if (!pack) return;
  pack.disabled = !pack.disabled;
  this.saveState();
  this.toast(pack.disabled ? 'Pack deaktiviert' : 'Pack aktiviert');
  this.render();
};

App.adminCreatePack = function() {
  const name = document.getElementById('ap-new-name').value.trim();
  if (!name) {
    this.toast('Name erforderlich', 'error');
    return;
  }
  const price = parseInt(document.getElementById('ap-new-price').value) || 500;
  const cards = parseInt(document.getElementById('ap-new-cards').value) || 5;
  const id = 'pack_' + Date.now();

  this.state.packs.push({
    id,
    name,
    price,
    color: 'linear-gradient(145deg, #2a2a3a, #15151e)',
    accent: '#d4af37',
    cards,
    guaranteed: ['rare'],
    rates: { common: 20, uncommon: 25, rare: 30, double: 15, ultra: 7, illustration: 3 }
  });
  this.saveState();
  this.toast(`Pack "${name}" erstellt`, 'success');
  this.render();
};

App.adminForcePull = function() {
  const val = document.getElementById('apull-force').value.trim();
  if (!val) return;
  this.state.forceNext = val;
  this.saveState();
  this.toast(`Nächster Pull erzwungen: ${val}`, 'success');
  this.render();
};

App.adminGiveRandom = function(n) {
  for (let i = 0; i < n; i++) {
    const card = this.state.cards[Math.floor(Math.random() * this.state.cards.length)];
    this.state.collection[card.id] = (this.state.collection[card.id] || 0) + 1;
  }
  this.saveState();
  this.toast(`+${n} zufällige Karten`, 'success');
};

App.adminGiveAllOfRarity = function(rarity) {
  const cards = this.state.cards.filter(c => c.rarity === rarity);
  cards.forEach(c => {
    this.state.collection[c.id] = (this.state.collection[c.id] || 0) + 1;
  });
  this.saveState();
  this.toast(`${cards.length} ${rarity}-Karten hinzugefügt`, 'success');
};

App.adminClearCollection = function() {
  if (!confirm('Sammlung wirklich leeren?')) return;
  this.state.collection = {};
  this.saveState();
  this.toast('Sammlung geleert');
  this.render();
};

App.adminResetStats = function() {
  if (!confirm('Statistiken zurücksetzen?')) return;
  this.state.stats = {
    packsOpened: 0, cardsPulled: 0, rarePulls: 0, holoPulls: 0,
    cardsSold: 0, totalSpent: 0, totalEarned: 0, rarestPull: null, binderPages: 0
  };
  this.saveState();
  this.toast('Statistiken zurückgesetzt');
  this.render();
};

  </script>
